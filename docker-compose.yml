services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: seats}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, retries: 30}
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/seats
      ADMIN_TOKEN: admin-secret
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
